name: Build and push to GHCR

on:
  push:
    branches:
      - icloudpd-1.33.0
    paths:
      - build_version.txt
      - icloudpd.dockerfile
      - .github/workflows/ghcr.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag
        id: version
        run: |
          BUILD_VERSION=$(tr -d '[:space:]' < build_version.txt)
          ICLOUDPD_VERSION=$(sed -n 's/^ARG icloudpd_version="\(.*\)"/\1/p' icloudpd.dockerfile | head -n1)
          echo "tag=1.0.${BUILD_VERSION}-icloudpd${ICLOUDPD_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: icloudpd.dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
